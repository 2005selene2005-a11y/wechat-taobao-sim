<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>微信模拟</title><style>
*{box-sizing:border-box}body{margin:0;background:#c8c8c8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#191919}.app{width:min(390px,100vw);height:100dvh;margin:auto;background:#ededed;position:relative;overflow:hidden}.screen{display:none;height:100%;padding-bottom:60px}.screen.on{display:block}.bar{height:52px;padding:15px 16px 10px;text-align:center;font-weight:600;background:#ededed;position:relative}.back,.right{position:absolute;top:10px;border:0;background:none;font-size:23px}.back{left:10px}.right{right:10px}.chat-list{background:#fff}.contact{height:76px;padding:10px 14px;display:flex;gap:12px;border-bottom:1px solid #eee}.avatar{width:48px;height:48px;border-radius:5px;object-fit:cover}.grow{flex:1;min-width:0}.row{display:flex;justify-content:space-between;align-items:center}.contact b{font-size:16px}.preview{margin-top:8px;color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#aaa;font-size:11px}.badge{background:#f44;color:#fff;font-size:10px;padding:2px 6px;border-radius:12px}.tabs{position:absolute;bottom:0;left:0;right:0;height:60px;background:#f7f7f7;border-top:1px solid #ddd;display:flex;z-index:15}.tab{flex:1;text-align:center;color:#666;font-size:11px;padding-top:7px}.tab i{font-style:normal;font-size:22px;display:block;height:29px}.tab.active{color:#07c160}.placeholder{padding-top:180px;text-align:center;color:#999}.chat{padding-bottom:53px}.msgs{height:calc(100% - 105px);overflow:auto;padding:8px 12px 22px}.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-start}.msg.me{flex-direction:row-reverse}.msg .avatar{width:39px;height:39px}.bubble{max-width:72%;padding:10px 12px;background:#fff;border-radius:5px;line-height:1.42;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px #0000000a}.me .bubble{background:#95ec69}.stamp{text-align:center;color:#999;font-size:11px;margin:13px}.sys{text-align:center;color:#999;font-size:12px;margin:10px}.sticker{max-width:118px;max-height:118px}.photo{max-width:190px;max-height:230px;border-radius:5px;display:block}.card{width:230px;background:#fff;border-radius:7px;overflow:hidden;box-shadow:0 1px 2px #0002}.packet{background:#f59d48;color:#fff;padding:13px;display:flex;gap:11px;align-items:center}.packet .ico{font-size:30px}.packet small{display:block;opacity:.85;margin-top:4px}.cardfoot{font-size:11px;color:#999;padding:6px 12px}.product{display:flex;gap:10px;padding:10px}.product img{width:70px;height:70px}.price{color:#f4511e;margin-top:7px}.composer{position:absolute;bottom:0;height:53px;left:0;right:0;background:#f7f7f7;padding:7px;display:flex;gap:7px;z-index:14}.composer input{flex:1;border:0;border-radius:5px;padding:0 10px;font-size:16px}.btn{border:0;border-radius:5px;background:#07c160;color:#fff;padding:0 14px}.tool{background:none;border:0;font-size:24px}.panel{position:absolute;bottom:53px;left:0;right:0;background:#f7f7f7;border-top:1px solid #ddd;padding:15px;display:none;z-index:13}.panel.on{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{text-align:center;font-size:12px;color:#666}.tile span{display:grid;place-items:center;background:#fff;border:1px solid #ddd;border-radius:10px;height:54px;font-size:27px;margin-bottom:5px}.wallet-card{margin:15px;background:linear-gradient(135deg,#596b83,#334155);color:#fff;border-radius:13px;padding:24px}.wallet-card .money{font-size:34px;margin-top:22px}.ledger{background:#fff;margin-top:12px}.ledger-item{padding:13px 16px;border-bottom:1px solid #eee}.ledger-item .amt{font-weight:600}.packet-modal,.modal{position:absolute;inset:0;background:#0008;z-index:30;display:none;place-items:center}.modal.on,.packet-modal.on{display:grid}.dialog{width:84%;background:#fff;border-radius:12px;padding:20px}.packet-open{width:82%;height:480px;background:#c8483d;border-radius:14px;color:#f7d8a0;text-align:center;overflow:hidden;position:relative;padding-top:55px}.packet-open:before{content:"";position:absolute;left:-25%;right:-25%;top:-180px;height:350px;border-radius:50%;background:#d9594d}.packet-open>*{position:relative}.open-circle{width:88px;height:88px;border-radius:50%;border:0;background:#e9bd72;font-size:34px;margin:85px auto 20px}.typing{font-size:12px;color:#999;padding-left:60px;display:none}.mine{padding:15px}.setting{background:#fff;padding:14px;margin-bottom:1px;display:flex;align-items:center;gap:12px}.toast{position:absolute;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#222d;color:#fff;padding:8px 14px;border-radius:5px;display:none}.menu{position:fixed;background:#333;color:#fff;border-radius:5px;z-index:40;display:none}.menu button{border:0;background:none;color:#fff;padding:10px}.full{position:absolute;inset:0;background:#000e;z-index:60;display:none;place-items:center}.full.on{display:grid}.full img{max-width:100%;max-height:100%}
</style></head><body><main class="app"><section id="home" class="screen on"><div class="bar">微信模拟 <button class="right" onclick="location.href='/'">⌂</button></div><div class="chat-list"><div class="contact" onclick="openChat()"><img id="listAv" class="avatar" src="/api/avatar/ai"><div class="grow"><div class="row"><b id="listName">AI</b><span class="time" id="lastTime"></span></div><div class="row"><span class="preview" id="preview">开始聊天吧</span><span class="badge" id="unread" hidden></span></div></div></div></div><div class="tabs"><div class="tab active" onclick="show('home')"><i>💬</i>微信</div><div class="tab" onclick="placeholder('通讯录')"><i>👥</i>通讯录</div><div class="tab" onclick="placeholder('发现')"><i>◉</i>发现</div><div class="tab" onclick="show('mine')"><i>◉</i>我</div></div></section><section id="empty" class="screen"><div class="bar"><button class="back" onclick="show('home')">‹</button><span id="emptyTitle"></span></div><div class="placeholder">这里是演示占位页</div></section><section id="chat" class="screen chat"><div class="bar"><button class="back" onclick="show('home')">‹</button><span id="chatName">AI</span><button class="right" onclick="location.href='/tb'">🛍</button></div><div id="msgs" class="msgs"></div><div id="typing" class="typing">对方正在输入…</div><div id="tools" class="panel"><div class="tile" onclick="pickImage()"><span>🖼</span>图片</div><div class="tile" onclick="openPay('packet')"><span>🧧</span>红包</div><div class="tile" onclick="openPay('transfer')"><span>💸</span>转账</div><div class="tile" onclick="stickers()"><span>😊</span>表情</div></div><div id="stickers" class="panel"></div><div class="composer"><button class="tool" onclick="toggleTools()">⊕</button><input id="text" placeholder="输入消息" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">发送</button></div></section><section id="wallet" class="screen"><div class="bar"><button class="back" onclick="show('mine')">‹</button>零钱</div><div class="wallet-card">零钱余额<div class="money">¥ <span id="balance">0.00</span></div></div><div id="ledger" class="ledger"></div></section><section id="mine" class="screen"><div class="bar">我</div><div class="mine"><div class="setting"><img id="myAv" class="avatar" src="/api/avatar/user"><b id="myName">我</b></div><div class="setting" onclick="showWallet()">💰 <span class="grow">钱包 / 零钱</span>›</div><div class="setting" onclick="location.href='/tb?view=orders'">📦 <span class="grow">我的订单</span>›</div><label class="setting">📷 <span class="grow">更换我的头像</span><input hidden type="file" accept="image/*" onchange="uploadAvatar('user',this.files[0])"></label><label class="setting">🙂 <span class="grow">更换 AI 头像</span><input hidden type="file" accept="image/*" onchange="uploadAvatar('ai',this.files[0])"></label></div><div class="tabs"><div class="tab" onclick="show('home')"><i>💬</i>微信</div><div class="tab"><i>👥</i>通讯录</div><div class="tab"><i>◉</i>发现</div><div class="tab active"><i>◉</i>我</div></div></section><input id="imagePick" hidden type="file" accept="image/*" onchange="uploadImage(this.files[0])"><div id="pay" class="modal"><div class="dialog"><h3 id="payTitle">发红包</h3><input id="amount" type="number" step="0.01" placeholder="金额" style="width:100%;padding:11px"><input id="note" placeholder="留言" style="width:100%;padding:11px;margin-top:10px"><p><button class="btn" style="height:36px" onclick="submitPay()">发送</button> <button onclick="closeModal()">取消</button></p></div></div><div id="packetModal" class="packet-modal"><div class="packet-open"><h3 id="packetFrom">AI 的红包</h3><p id="packetMsg">祝你开心</p><button class="open-circle" onclick="doOpen()">開</button><p id="packetResult"></p><button onclick="closePacket()">关闭</button></div></div><div id="menu" class="menu"></div><div id="full" class="full" onclick="this.classList.remove('on')"><img id="fullImg"></div><div id="toast" class="toast"></div></main><script>
const $=s=>document.querySelector(s);let state={},last=0,currentPacket=0,payType='packet';const api=async(u,o)=>{let r=await fetch(u,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'操作失败');return j},post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');if(id==='home')refreshHome()}function placeholder(t){$('#emptyTitle').textContent=t;show('empty')}function esc(s=''){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}async function init(){state=await api('/api/wx/state');$('#listName').textContent=$('#chatName').textContent=state.ai_name;$('#myName').textContent=state.user_name;await refreshHome();setInterval(poll,1300)}async function refreshHome(){let f=await api('/api/wx/feed?n=1');if(f.length){$('#preview').textContent=preview(f[0]);$('#lastTime').textContent=f[0].ts.slice(11,16)}let s=await api('/api/wx/state');$('#unread').hidden=!s.unread;$('#unread').textContent=s.unread||''}function preview(m){return {packet:'[红包]',transfer:'[转账]',gift:'[礼物]',product:'[商品]',image:'[图片]',sticker:'[表情]'}[m.kind]||m.text||'开始聊天吧'}async function openChat(){show('chat');await post('/api/wx/seen',{});let f=await api('/api/wx/feed');render(f);last=f.length?f[f.length-1].id:0}function msgHtml(m){if(m.kind==='sys')return `<div class="sys" data-id="${m.id}">${esc(m.text)}</div>`;let av=`/api/avatar/${m.sender==='user'?'user':'ai'}?v=${state.avatar_v?.[m.sender]||0}`,body='';if(m.kind==='text')body=`<div class="bubble">${esc(m.text)}</div>`;else if(m.kind==='sticker')body=`<img class="sticker" src="/api/wx/sticker/${encodeURIComponent(m.text)}">`;else if(m.kind==='image')body=`<img class="photo" src="/api/wx/media/${encodeURIComponent(m.text)}" onclick="full(this.src)">`;else if(m.kind==='packet'||m.kind==='transfer'){let p=m.packet,lab=m.kind==='packet'?'微信红包':'转账';body=`<div class="card" onclick="packet(${p.id},'${m.kind}')"><div class="packet"><span class="ico">${m.kind==='packet'?'🧧':'💳'}</span><div>${esc(p.msg||lab)}<small>${p.status==='opened'?'已领取':p.status==='expired'?'已过期':m.kind==='transfer'?'¥'+Number(p.amount).toFixed(2):'领取红包'}</small></div></div><div class="cardfoot">${lab}</div></div>`}else if(m.kind==='gift'||m.kind==='product'){let p=m.gift||m.product;body=`<div class="card" onclick="location.href='/tb?item=${p.item_id||p.id}'"><div class="product"><img src="${p.img}"><div>${esc(p.title)}<div class="price">¥${Number(p.price).toFixed(2)}</div></div></div><div class="cardfoot">${m.kind==='gift'?'送给你的礼物':'商品分享'} · 查看详情</div></div>`}return `<div class="msg ${m.sender==='user'?'me':''}" data-id="${m.id}" oncontextmenu="menu(event,${m.id},'${m.sender}','${m.kind}')"><img class="avatar" src="${av}">${body}</div>`}function render(a){let e=$('#msgs');e.innerHTML=a.map(msgHtml).join('');e.scrollTop=e.scrollHeight}async function poll(){if(!$('#chat').classList.contains('on'))return;let d=await api('/api/wx/poll?since='+last);if(d.msgs.length){d.msgs.forEach(m=>{$('#msgs').insertAdjacentHTML('beforeend',msgHtml(m));last=Math.max(last,m.id)});$('#msgs').scrollTop=$('#msgs').scrollHeight}d.gone.forEach(g=>{let e=document.querySelector(`[data-id="${g.id}"]`);if(e){if(g.status==='deleted')e.remove();else e.outerHTML=`<div class="sys" data-id="${g.id}">${g.sender==='user'?'你':state.ai_name}撤回了一条消息</div>`}});$('#typing').style.display=d.typing?'block':'none'}async function send(){let e=$('#text'),t=e.value.trim();if(!t)return;e.value='';await post('/api/wx/say',{text:t});openChat()}function toggleTools(){$('#stickers').classList.remove('on');$('#tools').classList.toggle('on')}function pickImage(){$('#imagePick').click()}async function uploadImage(f){if(!f)return;let b=new FormData;b.append('file',f);await api('/api/wx/media',{method:'POST',body:b});$('#tools').classList.remove('on');openChat()}async function stickers(){let a=await api('/api/wx/stickers'),e=$('#stickers');e.innerHTML=a.length?a.map(x=>`<div class="tile" onclick="sendSticker('${encodeURIComponent(x.name)}')"><span><img class="sticker" src="/api/wx/sticker/${encodeURIComponent(x.name)}"></span>${esc(x.desc||'表情')}</div>`).join(''):`<div>还没有表情，请在「我」页上传。</div>`;e.classList.add('on');$('#tools').classList.remove('on')}async function sendSticker(n){await post('/api/wx/say',{sticker:decodeURIComponent(n)});$('#stickers').classList.remove('on');openChat()}function openPay(t){payType=t;$('#payTitle').textContent=t==='packet'?'发红包':'转账';$('#pay').classList.add('on')}function closeModal(){$('#pay').classList.remove('on')}async function submitPay(){try{await post('/api/wx/packet/send',{amount:$('#amount').value,msg:$('#note').value,type:payType});closeModal();openChat()}catch(e){toast(e.message)}}async function packet(id,type){currentPacket=id;let p=await api('/api/wx/packet/'+id);$('#packetFrom').textContent=(p.sender==='ai'?state.ai_name:'你')+(type==='packet'?'的红包':'的转账');$('#packetMsg').textContent=p.msg||'祝你开心';$('#packetResult').textContent=p.amount!=null&&p.status!=='new'?'¥ '+Number(p.amount).toFixed(2):'';$('.open-circle').style.display=p.receiver==='user'&&p.status==='new'?'inline-block':'none';$('#packetModal').classList.add('on')}async function doOpen(){let d=await post('/api/wx/packet/open',{id:currentPacket});$('#packetResult').textContent='¥ '+Number(d.packet.amount).toFixed(2);$('.open-circle').style.display='none'}function closePacket(){$('#packetModal').classList.remove('on');openChat()}function full(src){$('#fullImg').src=src;$('#full').classList.add('on')}function menu(ev,id,sender,kind){ev.preventDefault();let e=$('#menu'),buttons=kind==='text'?`<button onclick="copyMsg(${id})">复制</button>`:'';if(sender==='user'&&['text','sticker','image'].includes(kind))buttons+=`<button onclick="act('/api/wx/recall',${id})">撤回</button>`;buttons+=`<button onclick="act('/api/wx/del',${id})">删除</button>`;e.innerHTML=buttons;e.style.cssText=`display:block;left:${Math.min(ev.clientX,250)}px;top:${ev.clientY}px`;setTimeout(()=>document.addEventListener('click',()=>e.style.display='none',{once:true}),0)}async function copyMsg(id){let m=(await api('/api/wx/feed')).find(x=>x.id===id);navigator.clipboard.writeText(m?.text||'');toast('已复制')}async function act(u,id){try{await post(u,{id});openChat()}catch(e){toast(e.message)}}async function showWallet(){show('wallet');let d=await api('/api/wallet/ledger');$('#balance').textContent=Number(d.balance).toFixed(2);$('#ledger').innerHTML=d.rows.length?d.rows.map(x=>`<div class="ledger-item"><div class="row"><span>${esc(x.note)}</span><span class="amt" style="color:${x.amount>=0?'#07a85b':'#222'}">${x.amount>=0?'+':''}${Number(x.amount).toFixed(2)}</span></div><small class="time">${x.ts}</small></div>`).join(''):'<div class="placeholder" style="padding:70px">暂无账单</div>'}async function uploadAvatar(w,f){if(!f)return;let b=new FormData;b.append('file',f);await api('/api/avatar/'+w,{method:'POST',body:b});document.querySelectorAll(w==='user'?'#myAv':'#listAv').forEach(x=>x.src='/api/avatar/'+w+'?v='+Date.now());toast('头像已更新')}init().catch(e=>toast(e.message));
</script></body></html>
