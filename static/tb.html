<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>淘宝模拟</title><style>
*{box-sizing:border-box}body{margin:0;background:#ccc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.app{width:min(390px,100vw);height:100dvh;margin:auto;background:#f5f5f5;overflow:hidden;position:relative}.view{height:100%;overflow:auto;padding-bottom:64px;display:none}.view.on{display:block}.top{padding:10px 12px;background:linear-gradient(110deg,#ff7a18,#ff4d20);position:sticky;top:0;z-index:5}.search{height:38px;background:#fff;border-radius:20px;display:flex;align-items:center;padding:0 13px;gap:8px}.search input{flex:1;border:0;outline:0;font-size:15px}.search button{border:0;background:#ff5b22;color:#fff;border-radius:14px;padding:5px 12px}.banner{margin:10px 10px 0;padding:18px;border-radius:14px;background:linear-gradient(120deg,#fff0d6,#ffd4cb);height:115px}.banner h2{margin:5px 0}.cats{display:flex;overflow:auto;padding:13px 8px;background:#fff;margin-top:8px}.cat{min-width:68px;text-align:center;font-size:12px}.cat i{font-style:normal;font-size:25px;display:block}.feed{columns:2;column-gap:8px;padding:8px}.item{break-inside:avoid;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:8px}.item img{width:100%;display:block}.info{padding:9px}.title{font-size:14px;line-height:1.35;height:38px;overflow:hidden}.price{color:#ff4d20;font-size:19px;font-weight:700;margin-top:6px}.price small{font-size:11px}.sold{float:right;color:#999;font-size:10px;font-weight:400;margin-top:6px}.nav{position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #eee;display:flex;z-index:9}.nav div{flex:1;text-align:center;font-size:11px;color:#777;padding:6px 0}.nav i{font-style:normal;font-size:21px;display:block}.nav .active{color:#ff4d20}.head{height:50px;position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;z-index:5}.head button{position:absolute;left:9px;border:0;background:none;font-size:26px}.detail-img{width:100%;display:block}.detail{background:#fff;padding:15px}.detail-price{color:#ff4d20;font-size:28px;font-weight:700}.detail-title{font-size:19px;margin:10px 0;line-height:1.4}.shop{padding:15px;background:#fff;margin-top:8px}.actions{position:sticky;bottom:0;height:58px;background:#fff;display:flex;align-items:center;padding:6px 10px;gap:8px}.actions button{height:44px;border:0;border-radius:22px;padding:0 18px}.orange{background:#ff8b18;color:#fff}.red{background:#ff4d20;color:#fff}.plain{background:#fff;border:1px solid #ddd!important}.cart-row,.order{display:flex;gap:11px;margin:9px;background:#fff;padding:11px;border-radius:10px}.cart-row img,.order img{width:88px;height:88px;border-radius:7px}.grow{flex:1}.empty{text-align:center;color:#999;padding:150px 20px}.summary{position:sticky;bottom:58px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:space-between}.mebox{background:linear-gradient(120deg,#ff6734,#ff8d20);color:#fff;padding:38px 20px 28px}.money{font-size:27px;margin-top:13px}.stats{margin:12px;background:#fff;border-radius:12px;display:flex;padding:18px 5px}.stats div{flex:1;text-align:center}.toast{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);background:#222d;color:#fff;padding:8px 15px;border-radius:6px;display:none;z-index:20}
</style></head><body><main class="app"><section id="home" class="view on"><div class="top"><div class="search">🔍<input id="q" placeholder="搜索好物" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">搜索</button></div></div><div class="banner"><small>每日精选 · 虚拟商城</small><h2>给生活一点小惊喜</h2><span>本地商品数据，不涉及真实支付</span></div><div id="cats" class="cats"></div><div id="feed" class="feed"></div></section><section id="detail" class="view"><div class="head"><button onclick="go('home')">‹</button>商品详情</div><div id="detailBody"></div></section><section id="cart" class="view"><div class="head">购物车</div><div id="cartList"></div><div class="summary"><span>合计 ¥<b id="total">0.00</b></span><button class="red" onclick="buy()">结算</button></div></section><section id="orders" class="view"><div class="head"><button onclick="go('me')">‹</button>我的订单</div><div id="orderList"></div></section><section id="me" class="view"><div class="mebox"><h2 id="userName">我</h2><div>零钱余额</div><div class="money">¥ <span id="meMoney">0.00</span></div></div><div class="stats"><div onclick="go('orders')">📦<br><small>全部订单</small></div><div>♥<br><small id="favCount">收藏 0</small></div><div onclick="go('cart')">🛒<br><small id="cartCount">购物车 0</small></div><div onclick="location.href='/wx'">💬<br><small>去聊天</small></div></div><div class="shop">🎁 收到的礼物 <b id="giftCount">0</b> 件</div></section><nav class="nav"><div data-v="home" class="active" onclick="go('home')"><i>⌂</i>首页</div><div onclick="searchPrompt()"><i>⌕</i>分类</div><div data-v="cart" onclick="go('cart')"><i>🛒</i>购物车</div><div data-v="me" onclick="go('me')"><i>◉</i>我的</div></nav><div id="toast" class="toast"></div></main><script>
const $=s=>document.querySelector(s),api=async(u,o)=>{let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'操作失败');return j},post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),esc=(s='')=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let detail=null,cart=[];function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}function card(x){return `<article class="item" onclick="item(${x.id})"><img src="${x.img}" loading="lazy"><div class="info"><div class="title">${x.mall?'<b style="color:#ff4d20">商城</b> ':''}${esc(x.title)}</div><div class="price"><small>¥</small>${Number(x.price).toFixed(2)} <span class="sold">已售 ${x.sold}</span></div></div></article>`}async function home(cat=''){let d=await api('/api/tb/feed?seed=42&cat='+encodeURIComponent(cat));$('#feed').innerHTML=d.items.map(card).join('');let c=await api('/api/tb/categories');$('#cats').innerHTML=`<div class="cat" onclick="home()"><i>✨</i>全部</div>`+c.map(x=>`<div class="cat" onclick="home('${esc(x.name)}')"><i>${x.emoji}</i>${esc(x.name)}</div>`).join('')}async function search(){let q=$('#q').value.trim();if(!q)return;let d=await api('/api/tb/search?q='+encodeURIComponent(q));$('#feed').innerHTML=d.items.length?d.items.map(card).join(''):'<div class="empty">没有找到相关商品</div>'}function searchPrompt(){go('home');$('#q').focus()}async function item(id){detail=await api('/api/tb/item/'+id);$('#detailBody').innerHTML=`<img class="detail-img" src="${detail.img}"><div class="detail"><div class="detail-price">¥${Number(detail.price).toFixed(2)}</div><div class="detail-title">${esc(detail.title)}</div><div style="color:#777">${esc(detail.sub)}</div><small>已售 ${detail.sold} · ${esc(detail.cat)}</small></div><div class="shop">🏪 ${esc(detail.shop)}</div><div class="actions"><button class="plain" onclick="location.href='/wx'">💬 聊天</button><button class="plain" onclick="share()">分享</button><button class="orange grow" onclick="add(${detail.id})">加入购物车</button><button class="red grow" onclick="buyNow(${detail.id})">立即购买</button></div>`;go('detail',false)}async function add(id){await post('/api/tb/cart',{id,op:'add'});toast('已加入购物车')}async function share(){await post('/api/tb/share',{id:detail.id});toast('已分享到聊天')}async function buyNow(id){try{await post('/api/tb/buy',{ids:[id]});toast('下单成功');setTimeout(()=>go('orders'),500)}catch(e){toast(e.message)}}async function loadCart(){let d=await api('/api/tb/cart');cart=d.items;$('#cartList').innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><img src="${x.img}" onclick="item(${x.id})"><div class="grow"><b>${esc(x.title)}</b><p>${esc(x.shop)}</p><span class="price">¥${Number(x.price).toFixed(2)}</span></div><button class="plain" onclick="removeCart(${x.id})">删除</button></div>`).join(''):'<div class="empty">购物车还是空的</div>';$('#total').textContent=cart.reduce((a,x)=>a+x.price,0).toFixed(2)}async function removeCart(id){await post('/api/tb/cart',{id,op:'remove'});loadCart()}async function buy(){if(!cart.length)return toast('先选点商品吧');try{await post('/api/tb/buy',{ids:cart.map(x=>x.id)});toast('下单成功');go('orders')}catch(e){toast(e.message)}}async function loadOrders(){let a=await api('/api/tb/orders');$('#orderList').innerHTML=a.length?a.map(x=>`<div class="order"><img src="${x.img}"><div class="grow"><b>${esc(x.title)}</b><p>${x.from_ai?'🎁 TA 送你的':'已付款'} · ${esc(x.status)}</p><span class="price">¥${Number(x.price).toFixed(2)}</span></div>${x.status==='已付款'?`<button class="plain" onclick="confirmOrder(${x.id})">确认收货</button>`:''}</div>`).join(''):'<div class="empty">还没有订单</div>'}async function confirmOrder(id){await post('/api/tb/confirm',{id});loadOrders()}async function loadMe(){let d=await api('/api/tb/me');$('#userName').textContent=d.user_name;$('#meMoney').textContent=Number(d.balance).toFixed(2);$('#favCount').textContent='收藏 '+d.nfav;$('#cartCount').textContent='购物车 '+d.ncart;$('#giftCount').textContent=d.gifts}function go(v,load=true){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#'+v).classList.add('on');document.querySelectorAll('.nav div').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(load&&v==='home')home();if(v==='cart')loadCart();if(v==='orders')loadOrders();if(v==='me')loadMe();history.replaceState(null,'','/tb?view='+v)}async function init(){await home();let p=new URLSearchParams(location.search);if(p.get('item'))item(p.get('item'));else if(p.get('view'))go(p.get('view'));}init().catch(e=>toast(e.message));
</script></body></html>
