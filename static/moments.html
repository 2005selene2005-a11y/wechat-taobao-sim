<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>朋友圈</title><style>
*{box-sizing:border-box}body{margin:0;background:#ccc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}.app{width:min(390px,100vw);height:100dvh;margin:auto;background:#fff;overflow:auto;position:relative}.hero{height:280px;background:linear-gradient(145deg,#657a82,#263b43);position:relative;background-size:cover;background-position:center}.top{position:sticky;top:0;height:48px;margin-bottom:-48px;z-index:5;color:#fff;display:flex;justify-content:space-between;padding:9px 14px;text-shadow:0 1px 3px #000}.top button{border:0;background:none;color:inherit;font-size:25px}.owner{position:absolute;right:18px;bottom:-28px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}.owner img{width:70px;height:70px;border:3px solid #fff;border-radius:8px;background:#fff}.notice{margin:45px 15px 0;background:#333;color:#fff;border-radius:5px;padding:10px;display:none}.timeline{padding-top:38px}.moment{display:flex;gap:10px;padding:16px 14px;border-bottom:1px solid #eee}.av{width:43px;height:43px;border-radius:6px;object-fit:cover}.body{flex:1;min-width:0}.name{color:#576b95;font-weight:600}.text{margin:6px 0;line-height:1.45;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:255px}.grid.one{display:block;max-width:230px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.grid.one img{max-height:280px;aspect-ratio:auto}.loc,.meta{font-size:12px;color:#999;margin-top:8px}.loc{color:#576b95}.meta{display:flex;justify-content:space-between}.dots{border:0;background:#f2f3f5;color:#576b95;padding:1px 8px}.social{background:#f5f6f7;margin-top:8px;border-radius:4px;color:#576b95;font-size:13px}.likes,.comment{padding:6px 8px;border-bottom:1px solid #e8e8e8}.comment:last-child{border:0}.acts{position:absolute;background:#333;color:#fff;border-radius:5px;right:44px;margin-top:-30px;display:none}.acts button{border:0;background:none;color:#fff;padding:9px 13px}.composer{position:fixed;bottom:0;width:min(390px,100vw);background:#f6f6f6;padding:8px;display:none;gap:7px;z-index:8}.composer.on{display:flex}.composer input{flex:1;padding:9px;border:1px solid #ddd;border-radius:5px}.send{border:0;background:#07c160;color:#fff;border-radius:5px;padding:0 15px}.publish{position:fixed;inset:0;background:#ededed;z-index:10;display:none;width:min(390px,100vw);margin:auto;padding:15px}.publish.on{display:block}.publish textarea{width:100%;height:130px;border:0;padding:12px;font-size:16px}.publish select,.publish label{display:block;background:#fff;padding:13px;margin-top:1px}.thumbs img{width:72px;height:72px;object-fit:cover;margin:8px 5px 0 0}.empty{text-align:center;color:#999;padding:80px 0}
</style></head><body><main class="app"><div class="top"><button onclick="location.href='/wx'">‹</button><b>朋友圈</b><button onclick="openPost()">▣</button></div><div id="hero" class="hero" ondblclick="pickCover()"><div class="owner"><span id="ownerName">我</span><img src="/api/avatar/user"></div></div><div id="notice" class="notice"></div><div id="timeline" class="timeline"></div><div id="composer" class="composer"><input id="reply" placeholder="评论"><button class="send" onclick="comment()">发送</button></div><section id="publish" class="publish"><div style="display:flex;justify-content:space-between"><button onclick="closePost()">取消</button><b>发布动态</b><button class="send" onclick="submitPost()">发布</button></div><textarea id="postText" placeholder="分享这一刻…"></textarea><label>🖼 选择图片（最多 9 张）<input id="images" type="file" accept="image/*" multiple onchange="preview()"></label><div id="thumbs" class="thumbs"></div><select id="loc"><option>不显示</option><option>公司</option><option>学校</option><option>家</option><option>咖啡店</option><option>公园</option></select></section><input id="coverPick" hidden type="file" accept="image/*" onchange="cover(this.files[0])"></main><script>
const $=s=>document.querySelector(s), api=async(u,o)=>{let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'操作失败');return j},post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let state={},replyMid=0,filter=new URLSearchParams(location.search).get('author')||'';const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function ago(t){let n=(Date.now()-new Date(t.replace(' ','T')).getTime())/1000;if(n<60)return'刚刚';if(n<3600)return Math.floor(n/60)+'分钟前';if(n<86400)return Math.floor(n/3600)+'小时前';return t.slice(5,16)}function name(w){return w==='ai'?state.ai_name:state.user_name}function card(m){let imgs=m.imgs.length?`<div class="grid ${m.imgs.length===1?'one':''}">${m.imgs.map(x=>`<img src="${x}" onclick="window.open(this.src)">`).join('')}</div>`:'', likes=m.likes.length?`<div class="likes">♥ ${m.likes.map(x=>esc(name(x.who))).join('、')}</div>`:'',comments=m.comments.map(x=>`<div class="comment"><b>${esc(name(x.who))}</b>${x.reply_to?' 回复 <b>'+esc(name(x.reply_to))+'</b>':''}：${esc(x.text)}</div>`).join('');return `<article class="moment" data-id="${m.id}" oncontextmenu="if('${m.author}'==='user'){event.preventDefault();del(${m.id})}"><img class="av" src="/api/avatar/${m.author}"><div class="body"><div class="name">${esc(name(m.author))}</div><div class="text">${esc(m.text)}</div>${imgs}${m.loc?`<div class="loc">${esc(m.loc)}</div>`:''}<div class="meta"><span>${ago(m.ts)}</span><button class="dots" onclick="actions(this,${m.id},'${m.author}')">··</button></div><div class="acts"><button onclick="like(${m.id})">♥ 赞</button><button onclick="reply(${m.id})">评论</button>${m.author==='user'?`<button onclick="del(${m.id})">删除</button>`:''}</div>${likes||comments?`<div class="social">${likes}${comments}</div>`:''}</div></article>`}async function load(){state=await api('/api/wx/state');$('#ownerName').textContent=state.user_name;let d=await api('/api/wx/moments/feed'+(filter?'?author='+filter:''));if(d.cover)$('#hero').style.backgroundImage=`url(${d.cover})`;$('#timeline').innerHTML=d.items.length?d.items.map(card).join(''):'<div class="empty">还没有动态</div>';if(d.unseen){$('#notice').style.display='block';$('#notice').textContent=state.ai_name+'与你互动了 '+d.unseen+' 次'}await post('/api/wx/moments/seen',{})}function actions(e){document.querySelectorAll('.acts').forEach(x=>x.style.display='none');e.parentElement.nextElementSibling.style.display='block'}async function like(mid){await post('/api/wx/moments/like',{mid});load()}function reply(mid){replyMid=mid;$('#composer').classList.add('on');$('#reply').focus()}async function comment(){let t=$('#reply').value.trim();if(!t)return;await post('/api/wx/moments/comment',{mid:replyMid,text:t});$('#reply').value='';$('#composer').classList.remove('on');load()}async function del(id){if(confirm('删除这条动态？')){await post('/api/wx/moments/del',{id});load()}}function openPost(){$('#publish').classList.add('on')}function closePost(){$('#publish').classList.remove('on')}function preview(){let fs=[...$('#images').files].slice(0,9);$('#thumbs').innerHTML='';fs.forEach(f=>{let i=new Image;i.src=URL.createObjectURL(f);$('#thumbs').append(i)})}async function submitPost(){let b=new FormData;b.append('text',$('#postText').value);b.append('loc',$('#loc').value);[...$('#images').files].slice(0,9).forEach(x=>b.append('images',x));await api('/api/wx/moments/post',{method:'POST',body:b});closePost();load()}function pickCover(){$('#coverPick').click()}async function cover(f){if(!f)return;let b=new FormData;b.append('image',f);await api('/api/wx/moments/cover',{method:'POST',body:b});load()}load();
</script></body></html>
